name: PR Quality Check

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Установка pytest и зависимостей для тестов
        pip install pytest
        # Проверяем наличие requirements.txt
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
    
    # Используем официальный Ruff action
    - name: Run Ruff linting
      uses: astral-sh/ruff-action@v3
      with:
        # args: check --output-format=github
        # Или только проверка измененных файлов:
        args: check --output-format=github $(git diff --name-only origin/${{ github.base_ref }} HEAD -- '*.py' 2>/dev/null | tr '\n' ' ' || echo ".")
    
    - name: Run unit tests
      run: |
        # Проверяем наличие тестов и запускаем их
        if [ -d "tests" ] || [ -f "test_*.py" ] || [ -f "setup.py" ]; then
          echo "Running unit tests..."
          python -m pytest tests/ -v
        else
          echo "No tests found, skipping test execution"
        fi
