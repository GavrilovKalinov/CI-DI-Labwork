name: PR Quality Check

on:
  pull_request:
    branches: [master, main]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install pytest
      run: pip install pytest
    
    - name: Run Ruff (check only changed files)
      uses: astral-sh/ruff-action@v3
      with:
        # Ruff проверит только файлы, которые были изменены в PR
        args: check --output-format=github
    
    - name: Run unit tests
      run: |
        echo "Running unit tests..."
        if [ -d "tests" ]; then
          python -m pytest tests/ -v
        else
          echo "No tests directory found"
          # Создаем минимальный тест для демонстрации
          mkdir -p tests
          echo 'def test_example(): assert 1 + 1 == 2' > tests/test_example.py
          python -m pytest tests/ -v
        fi
