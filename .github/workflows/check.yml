name: Test and Lint
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Debug - Show project structure
      run: |
        echo "=== Project structure ==="
        find . -type f -name "*.py" | head -30
        echo "=== Listing all files ==="
        ls -la
        echo "=== Checking for test files ==="
        find . -type f -name "*test*.py" -o -name "*Test*.py" | head -30
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest ruff
    
    - name: Run unit tests
      run: |
        # Проверяем структуру проекта и ищем тесты
        echo "Looking for test files..."
        
        # Поиск тестовых файлов
        TEST_FILES=$(find . -type f -name "*test*.py" -o -name "*Test*.py" | grep -v __pycache__ | head -10)
        
        if [ -z "$TEST_FILES" ]; then
          echo "No test files found with pattern *test*.py"
          echo "Trying to find tests in test directories..."
          if [ -d "tests" ]; then
            echo "Found tests directory, running tests from there..."
            python -m pytest tests/ --tb=short -v
          elif [ -d "test" ]; then
            echo "Found test directory, running tests from there..."
            python -m pytest test/ --tb=short -v
          else
            echo "No tests found. Running pytest on current directory..."
            python -m pytest --tb=short -v
          fi
        else
          echo "Found test files:"
          echo "$TEST_FILES"
          echo "Running tests..."
          python -m pytest --tb=short -v
        fi
    
    - name: Run Ruff linter
      run: |
        # Проверяем структуру проекта перед запуском Ruff
        echo "Running Ruff linter..."
        ruff check . --output-format=github
