name: CI Validation

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        
    - name: Run unit tests
      run: |
        # Замените на вашу команду для запуска тестов
        # Например: pytest, python -m unittest, etc.
        pytest --maxfail=1 || exit 1
        # Или используйте: python -m pytest -x  # останавливается после первого падения

  ruff-check:
    name: Run Ruff Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Ruff
      uses: astral-sh/ruff-action@v3
      with:
        # Выводить только ошибки (не предупреждения)
        args: "check --output-format=github --select=E,F"
        # Или для всех проверок: args: "check --output-format=github"y your project.
