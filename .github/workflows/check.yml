name: PR Quality Check

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get changed files
      id: changed-files
      run: |
        if [ ${{ github.event_name }} == 'push' ]; then
          # For push events, compare with previous commit
          git diff --name-only HEAD^ HEAD > changed_files.txt
        else
          # For PR events, get files from PR
          git diff --name-only origin/${{ github.base_ref }} HEAD > changed_files.txt
        fi
        echo "Changed files:"
        cat changed_files.txt
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        fi
        # Install pytest for unit tests
        pip install pytest
        # Install Ruff for linting
        pip install ruff
    
    - name: Run Ruff linting on changed files
      run: |
        # Filter only Python files from changed files
        grep "\.py$" changed_files.txt > python_files.txt || true
        if [ -s python_files.txt ]; then
          echo "Running Ruff on changed Python files:"
          cat python_files.txt
          ruff check --format=github $(cat python_files.txt)
        else
          echo "No Python files changed"
        fi
    
    - name: Run unit tests
      run: |
        # Run all unit tests (adjust test directory as needed)
        python -m pytest tests/ -v || echo "Unit tests failed"
        
        # Check if tests passed
        if [ $? -ne 0 ]; then
          echo "Unit tests failed - blocking merge"
          exit 1
        fi
